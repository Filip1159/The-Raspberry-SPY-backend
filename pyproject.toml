[tool.ruff]
line-length = 140
target-version = "py313"

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # sortowanie importów (isort)
    "B",   # bugbear
    "UP",  # modernizacja kodu
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# Needs the real Raspberry hardware, it cannot run anywhere else
omit = ["app/hardware/raspberry.py"]
