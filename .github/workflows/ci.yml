name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is what the Raspberry runs, 3.13 is where it will end up
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (no Raspberry libraries needed)
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (simulated hardware) with coverage
        run: python -m pytest --cov=app --cov-report=term-missing:skip-covered

  deploy:
    needs: lint-and-test
    # only for pushes to master, never for PRs: the runner executes the workflow on the Raspberry
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, raspberry-spy]
    concurrency:
      group: deploy-raspberry
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      # The runner's workspace is not the live checkout: deploy.sh updates that one with git pull --ff-only.
      - name: Deploy on the Raspberry
        working-directory: ${{ vars.BACKEND_DIR }}
        run: scripts/deploy.sh
