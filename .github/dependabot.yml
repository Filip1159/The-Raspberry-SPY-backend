version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["fastapi", "starlette", "uvicorn*", "pydantic*", "anyio", "h11", "httptools", "uvloop", "websockets"]
      socketio:
        patterns: ["*socketio*", "*engineio*", "simple-websocket", "wsproto", "bidict"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
